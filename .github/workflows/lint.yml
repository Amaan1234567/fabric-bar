name: Lint & Format Check

on:
  push:
    branches: [ main, "*" ]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - name: Run Ruff Linter
        run: ruff check .
      - name: Check Ruff Formatting
        run: ruff format --check .