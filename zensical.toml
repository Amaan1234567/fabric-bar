
[project]
site_url = "https://www.fabric-bar.com/"
site_name = "Fabric bar Docs"
# site_description = "Your project description"
# site_author = "Your name"
# copyright = "Copyright &copy; 2026 Your name"
# repo_url = "https://github.com/user/repo"
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

# API Reference navigation is generated automatically.
# No manual nav entry is necessary.
nav = [
    { "Home" = "index.md" },
]

# --------------------------------------------------
# API DOCUMENTATION
# --------------------------------------------------

[project.plugins.mkdocstrings]
enabled = true
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members = true
inherited_members = true
show_if_no_docstring = true
show_root_heading = true
show_signature = true
show_signature_annotations = true
show_source = true
filters = ["!^_"]

[project.plugins.api-autonav]
enabled = true

modules = [
    "start_shell.py",
    "side_monitors.py",
    "widgets/",
    "utils/",
    "services/",
    "modules/",
    "custom_widgets/",
]

nav_section_title = "API Reference"
api_root_uri = "reference"
exclude_private = true
show_full_namespace = true
on_implicit_namespace_package = "warn"


# --------------------------------------------------
# THEME
# --------------------------------------------------

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"

language = "en"

features = [
    "announce.dismiss",
    # "content.action.edit",
    # "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    # "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    # "navigation.tabs",
    # "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"


# --------------------------------------------------
# COLOR PALETTE
# --------------------------------------------------

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"


# --------------------------------------------------
# SOCIAL LINKS
# --------------------------------------------------

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
